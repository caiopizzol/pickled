<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts load without blocking first paint: fetched as print media, then
       promoted to all on load. global.css no longer @imports them. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
  />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
  </noscript>
  <meta name="description" content="Pickled runs real agent questions across a matrix of interfaces, sources, and toolsets, then scores the answers with deterministic checks." />
  <link rel="canonical" href="https://pickled.dev/" />
  <title>pickled - Test what agents actually understand</title>

  <!-- Description is duplicated verbatim across surfaces per brand.md.
       og-image.png is a 1200x630 render of og-card.html (this dir);
       regenerate it from that file if the tagline or palette changes. -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://pickled.dev/" />
  <meta property="og:site_name" content="pickled" />
  <meta property="og:title" content="pickled - Test what agents actually understand" />
  <meta property="og:description" content="Pickled runs real agent questions across a matrix of interfaces, sources, and toolsets, then scores the answers with deterministic checks." />
  <meta property="og:image" content="https://pickled.dev/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="pickled check terminal output: one well-grounded scenario, one fired trap, overall score 42 of 100." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="pickled - Test what agents actually understand" />
  <meta name="twitter:description" content="Pickled runs real agent questions across a matrix of interfaces, sources, and toolsets, then scores the answers with deterministic checks." />
  <meta name="twitter:image" content="https://pickled.dev/og-image.png" />

  <!-- SoftwareApplication: pickled is a free open-source developer CLI. No
       softwareVersion here on purpose, so this static markup never goes stale
       against the published package. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "pickled",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "macOS, Linux, Windows",
    "description": "Pickled runs real agent questions across a matrix of interfaces, sources, and toolsets, then scores the answers with deterministic checks.",
    "url": "https://pickled.dev/",
    "codeRepository": "https://github.com/caiopizzol/pickled",
    "downloadUrl": "https://www.npmjs.com/package/@pickled-dev/cli",
    "license": "https://opensource.org/licenses/MIT",
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "author": { "@type": "Person", "name": "Caio Pizzol" }
  }
  </script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-EF49SBB7Q7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-EF49SBB7Q7');
  </script>
</head>

<body>
  <!-- Raw-HTML crawl path for engines that do not execute JS. Sits outside
       #root, so the React mount never touches it. -->
  <noscript>
    <nav aria-label="pickled">
      <a href="https://docs.pickled.dev/getting-started">Getting started</a>
      <a href="https://docs.pickled.dev/">Documentation</a>
      <a href="https://github.com/caiopizzol/pickled">GitHub</a>
      <a href="https://www.npmjs.com/package/@pickled-dev/cli">npm</a>
    </nav>
  </noscript>
  <div id="root"><!--app-html--></div>
  <script type="module" src="/src/entry-client.tsx"></script>
</body>

</html>
