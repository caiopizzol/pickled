# 🥒 pickled.yml - public-docs dogfood for pickled itself

product:
  name: pickled
  description: Agent legibility checker for developer tools

# The public surfaces a real outside agent reads to learn about pickled.
# URL sources are fetched at check time; path sources are read from disk.
sources:
  docs: https://docs.pickled.dev/llms-full.txt
  getting_started: https://docs.pickled.dev/getting-started
  llms: ./llms.txt

# The agents under test. `quick` is the cheap answer-task default; `builder`
# gives build tasks enough turns to edit and verify a fixture.
agents:
  quick:
    provider: claude-code
    model: claude-haiku-4-5
    maxTurns: 5
  builder:
    provider: claude-code
    model: claude-haiku-4-5
    maxTurns: 30
  anthropic_api:
    provider: anthropic
    model: claude-haiku-4-5
    temperature: 0
    maxTokens: 4096
  openai_api:
    provider: openai
    model: gpt-5.2
    temperature: 0
    maxTokens: 4096

# Named context paths. Each pairs a source with a tool mode. This is the
# whole point of pickled: run the same task down different paths and
# see which one gets the agent to the right answer.
access:
  memory: { source: none, tools: none } # model memory, no context
  given_docs: { source: docs, tools: none } # docs content injected
  given_llms: { source: llms, tools: none } # root llms.txt injected
  given_getting_started: { source: getting_started, tools: none } # getting-started page injected
  web_open: { source: none, tools: web } # open web discovery
  web_docs: { source: docs, tools: web } # docs URL handed over, reached with web

tasks:
  # Positioning across the full context gradient, on three agents. The
  # `memory` cells answer from model memory; `given_docs` reads the docs;
  # `web_open` and `web_docs` reach the live site through web tools.
  # "agent" is the load-bearing noun, and a real summary names what the
  # tool checks (legibility / understanding / context).
  - id: positioning
    prompt: In one or two sentences, what does pickled do?
    agents: [quick, anthropic_api, openai_api]
    access: [memory, given_docs, web_open, web_docs]
    checks:
      mustMention: [agent]
      mustMentionOneOf:
        - label: names the capability
          values: [legible, legibility, understand, comprehend, context]
      mustNotMention: [magic dashboard, brand tracker]

  # Onboarding: a developer reading the docs should leave with the install
  # form, a pickled.yml, and the run command. A stale `npm install` form
  # means the agent drifted off the registered docs.
  - id: install
    prompt: How do I install pickled and run my first check?
    agents: [quick]
    access: [given_getting_started, given_docs]
    checks:
      mustMention: [bunx @pickled-dev/cli, pickled.yml, check .]
      mustNotMention: [magic dashboard, npm install @pickled-dev/cli]

  # Coverage of the tool modes pickled ships today. Firecrawl is proposed
  # but not shipped; an agent that claims it is the exact false-support
  # answer pickled exists to catch.
  - id: tool_modes
    prompt: Which tool modes can a pickled agent use today, and which agent or provider does each need?
    agents: [quick]
    access: [given_docs, given_llms]
    checks:
      mustMention: [none, web, mcp, Claude Code]
      mustNotMention: [magic dashboard, Firecrawl]

  # Build dogfood: can an agent use Pickled's own public context to author
  # and validate a Pickled config for a tiny product fixture?
  - id: write_pickled_config
    kind: build
    prompt: Create a pickled.yml for the BrineKit fixture product. The config should register the local llms.txt source, compare memory against injected llms context, define an answer task that verifies the documented install command while excluding stale npm install guidance, and define a build task named smoke_build that uses ./workspace, runs two trials, and verifies configured.txt exists.
    agents: [builder]
    access: [memory, given_llms]
    workspace:
      path: ./fixtures/pickled-config-authoring
    verify:
      - ./tests/verify-pickled-config.sh
    trials: 3

threshold: 60
