# 🥒 pickled.yml - public-docs dogfood for pickled itself

schemaVersion: 2

product:
  name: pickled
  description: Agent legibility checker for developer tools

# The public surfaces a real outside agent reads to learn about pickled.
sources:
  docs: { url: https://docs.pickled.dev/llms-full.txt }
  getting_started: { url: https://docs.pickled.dev/getting-started }
  github_actions: { url: https://docs.pickled.dev/github-actions }
  llms: { path: ./llms.txt }

# The agents under test. `quick` is the cheap question default; `builder`
# gives builds enough turns to edit and verify a fixture.
agents:
  quick:
    provider: claude-code
    model: claude-haiku-4-5
    maxTurns: 5
  builder:
    provider: claude-code
    model: claude-haiku-4-5
    maxTurns: 30
  anthropic_api:
    provider: anthropic
    model: claude-haiku-4-5
    temperature: 0
    maxTokens: 4096
  openai_api:
    provider: openai
    model: gpt-5.2
    temperature: 0
    maxTokens: 4096

# Named contexts: how a source reaches the agent. This is the whole point of
# pickled: run the same task down different paths and see which one gets the
# agent to the right answer.
contexts:
  memory: { mode: memory } # model memory, nothing injected
  given_docs: { mode: inject, source: docs } # docs content injected
  given_llms: { mode: inject, source: llms } # root llms.txt injected
  given_getting_started: { mode: inject, source: getting_started }
  given_github_actions: { mode: inject, source: github_actions }
  web_open: { mode: web } # open web discovery, no declared source
  web_docs: { mode: web, source: docs } # docs URL handed over, reached with web

# Reusable developer-workflow truths a correct answer must cover.
facts:
  install_command:
    statement: Gives the bunx install/init command.
    match:
      allOf: ["bunx @pickled-dev/cli"]
  config_file:
    statement: Names the pickled.yml config file.
    match:
      allOf: ["pickled.yml"]
  run_command:
    statement: Names the check command.
    match:
      allOf: ["check ."]
  tool_modes_all:
    statement: Names all four context modes.
    match:
      allOf: ["memory", "inject", "web", "mcp"]
  names_claude_code:
    statement: Names Claude Code as a provider.
    match:
      anyOf: ["Claude Code", "claude-code"]
  ci_pr_deterministic:
    statement: Says pull-request CI should run deterministic/offline Pickled checks.
    match:
      allOf: ["test .", "check . --plan"]
  ci_trusted_real_runs:
    statement: Says real agent runs belong on trusted branches, manual dispatch, or schedules.
    match:
      anyOf: ["workflow_dispatch", "schedule", "trusted"]
  ci_secrets:
    statement: Names the API key secrets used by real agent runs.
    match:
      anyOf: ["ANTHROPIC_API_KEY", "OPENAI_API_KEY"]
  public_sources:
    statement: Says public docs or llms.txt should be registered as sources.
    match:
      allOf: ["sources", "llms.txt"]
  compare_contexts:
    statement: Says to compare memory, injected, and discovery contexts.
    match:
      allOf: ["memory", "inject"]
      anyOf: ["web", "mcp"]
  facts_misstatements:
    statement: Says questions use facts and misstatements as the deterministic contract.
    match:
      allOf: ["facts", "misstatements"]
  fail_to_pass:
    statement: Explains failToPass as the behavior-changing verifier.
    match:
      allOf: ["failToPass"]
  pass_to_pass:
    statement: Explains passToPass as the regression guard.
    match:
      allOf: ["passToPass"]
  reference_solution:
    statement: Explains referenceSolution.patch as the positive control.
    match:
      allOf: ["referenceSolution"]

# Reusable wrong claims a correct answer must not make.
misstatements:
  magic_dashboard:
    statement: Calls pickled a magic dashboard.
    match:
      anyOf: ["magic dashboard"]
  brand_tracker:
    statement: Calls pickled a brand-mention tracker.
    match:
      anyOf: ["brand tracker"]
  npm_install:
    statement: Recommends installing the CLI with npm.
    match:
      anyOf: ["npm install @pickled-dev/cli"]
  firecrawl_mode:
    statement: Claims a Firecrawl tool mode exists today.
    match:
      anyOf: ["Firecrawl"]
  unsafe_pull_request_target:
    statement: Recommends pull_request_target for paid Pickled agent runs.
    match:
      anyOf: ["pull_request_target"]
  bare_verify:
    statement: Uses the removed v1 verify key instead of verifier.failToPass.
    match:
      anyOf: ["verify:"]

questions:
  # Developer workflow: install, create the config, then run the first check.
  - id: first_check
    question: How do I install pickled and run my first check?
    agents: [quick]
    contexts: [given_getting_started, given_docs]
    expects: [install_command, config_file, run_command]
    rejects: [magic_dashboard, npm_install]
    examples:
      pass:
        - "Run `bunx @pickled-dev/cli init` to create a pickled.yml, then `bunx @pickled-dev/cli check .` to run your first check."
      fail:
        - "Install with `npm install @pickled-dev/cli`, add a pickled.yml, then run check ."

  # Developer workflow: wire Pickled into CI without spending tokens on unsafe
  # pull-request paths.
  - id: github_actions
    question: How should I run Pickled safely in GitHub Actions?
    agents: [quick]
    contexts: [given_github_actions, given_docs]
    expects: [ci_pr_deterministic, ci_trusted_real_runs, ci_secrets]
    rejects: [unsafe_pull_request_target]
    examples:
      pass:
        - "On pull requests, run `bunx @pickled-dev/cli test .` and `bunx @pickled-dev/cli check . --plan`. Put real agent runs behind `workflow_dispatch`, a schedule, or trusted branches, and pass `ANTHROPIC_API_KEY` or `OPENAI_API_KEY` only there."
      fail:
        - "Use pull_request_target with ANTHROPIC_API_KEY and run the full paid benchmark on every fork PR."

  # Developer workflow: evaluate public docs, llms.txt, and discovery paths.
  - id: public_docs_eval
    question: How do I test whether agents understand my public docs or llms.txt?
    agents: [quick]
    contexts: [given_docs, given_llms]
    expects: [public_sources, compare_contexts, facts_misstatements]
    rejects: [magic_dashboard]
    examples:
      pass:
        - "Register docs and llms.txt as sources, compare memory against inject plus web or mcp contexts, and score answers with facts and misstatements."
      fail:
        - "Use the magic dashboard and let the model decide whether the docs are probably fine."

  # Developer workflow: avoid invalid provider/context combinations.
  - id: provider_context_modes
    question: Which context modes can a pickled agent use today, and which agent or provider does each need?
    agents: [quick]
    contexts: [given_docs, given_llms]
    expects: [tool_modes_all, names_claude_code]
    rejects: [magic_dashboard, firecrawl_mode]
    examples:
      pass:
        - "A pickled context can use memory, inject, web, or mcp. Claude Code supports all four; Codex CLI supports memory and inject; Anthropic supports memory, inject, and web; OpenAI supports all four."
      fail:
        - "Today a pickled agent supports web, mcp, and Firecrawl modes on Claude Code."

  # Developer workflow: write build tasks with trustworthy verification.
  - id: build_verifier
    question: What makes a Pickled build task verifier trustworthy?
    agents: [quick]
    contexts: [given_docs, given_llms]
    expects: [fail_to_pass, pass_to_pass, reference_solution]
    rejects: [bare_verify]
    examples:
      pass:
        - "Use verifier.failToPass for commands that fail on the untouched fixture and pass after the agent, passToPass for regression guards, and referenceSolution.patch as the positive control."
      fail:
        - "Put a bare verify: list in the build and trust the agent if any command exits zero."

builds:
  # Build dogfood: can an agent use Pickled's docs to wire the CLI into GitHub
  # Actions safely? The workspace contains a pickled.yml because the workflow
  # must run it, so `memory` means "not injected", not "unavailable".
  - id: add_github_actions_workflow
    goal: >-
      Add .github/workflows/pickled.yml for this repository fixture. The workflow
      should run deterministic Pickled checks on pull requests: install
      dependencies, run `bunx @pickled-dev/cli test .`, run
      `bunx @pickled-dev/cli check . --plan`, and run
      `bunx @pickled-dev/cli build . --plan`. Put real agent runs behind
      workflow_dispatch or schedule, pass ANTHROPIC_API_KEY from GitHub secrets
      there, cap the run with --max-cells, and never use pull_request_target.
    agents: [builder]
    contexts: [memory, given_llms]
    trials: 3
    workspace:
      path: ./fixtures/github-actions
    verifier:
      failToPass:
        - { name: safe workflow, run: ./tests/verify-workflow.sh }
      passToPass:
        # Regression guard: the workflow exists to run this config, so the
        # agent must not delete it. Green on the untouched fixture and must
        # stay green after.
        - { name: keeps pickled config, run: test -f pickled.yml }
    # Positive control: the reference workflow, applied to the baseline, must
    # pass the verifier. Proves the bar is reachable (verifierProof: passed)
    # rather than leaving it unproven. Lives outside the fixture so the agent
    # never sees it.
    referenceSolution:
      patch: ./fixtures/github-actions.solution.patch

thresholds:
  questions: 60
  builds: 60
