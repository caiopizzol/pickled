name: Agent dogfood

# Manual-only. Real agent runs are stochastic and spend LLM tokens, so they
# never run on push/PR (the deterministic dogfood - audit, test, check/build
# --plan, init - runs in ci.yml every time). Trigger this from the Actions tab
# when you want a real signal, choosing the command and optional filters.
#
# This replaces the old agent-dogfood + agent-dogfood-matrix pair. The matrix
# hand-mirrored task/agent/access names from pickled.yml into YAML, which
# silently drifted out of date and broke. If per-cell jobs are wanted again,
# generate them from `pickled check --plan --json`, never by copying names.
#
# Build health gate vs lift diagnostic. The build task declares two access
# paths: given_llms (context injected - the supported path) and memory (no
# injection - a baseline that is meant to be hard). A run that averages both
# is red by construction even when the product works, which is a bad
# operational signal. So a default build dispatch (no access, no threshold)
# gates on the supported path only: it forces --access given_llms and a green
# run means "agents can still build with our injected context." To measure the
# memory-vs-given_llms lift instead, set threshold=0 (leave access empty): that
# runs the full matrix and never reds on score, so the receipt's gradient is
# the signal. The memory cell stays declared in pickled.yml so --access memory
# remains available for ad-hoc diagnosis.
#
# Secrets (set in repo settings; missing keys produce error receipts):
# - ANTHROPIC_API_KEY_DOGFOOD (quick / anthropic_api / build agents)
# - OPENAI_API_KEY_DOGFOOD     (openai_api cells)
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Which Pickled command to run"
        type: choice
        options: [check, build]
        default: check
      task:
        description: "Run only this task id (optional)"
        required: false
      agent:
        description: "Run only this agent (optional)"
        required: false
      access:
        description: "Run only this access path (optional; build defaults to given_llms)"
        required: false
      threshold:
        description: "Override pass threshold (0 = never red; use for the build lift diagnostic)"
        required: false
      max_cells:
        description: "Abort if planned executions exceed N (optional)"
        required: false

jobs:
  dogfood:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: bun run --cwd apps/cli build

      # Inputs reach the script through env, not string interpolation, so a
      # crafted input cannot inject shell. The receipt is uploaded regardless;
      # Pickled's real exit code is reflected by the final step, so a low score
      # surfaces as a red run (product signal), not a swallowed pass.
      - name: pickled run
        id: run
        env:
          PICKLED_COMMAND: ${{ inputs.command }}
          PICKLED_TASK: ${{ inputs.task }}
          PICKLED_AGENT: ${{ inputs.agent }}
          PICKLED_ACCESS: ${{ inputs.access }}
          PICKLED_THRESHOLD: ${{ inputs.threshold }}
          PICKLED_MAX_CELLS: ${{ inputs.max_cells }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_DOGFOOD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_DOGFOOD }}
        run: |
          set +e
          # Default build dispatch (no access, no threshold) gates on the
          # supported path only, so a healthy product produces a green run.
          # threshold=0 opts out (full matrix, never red) for the lift
          # diagnostic; an explicit access also opts out of the default.
          if [[ "$PICKLED_COMMAND" == "build" && -z "$PICKLED_ACCESS" && -z "$PICKLED_THRESHOLD" ]]; then
            PICKLED_ACCESS="given_llms"
            echo "build health gate: defaulting --access given_llms (the supported path). For the memory-vs-given_llms lift, re-run with threshold=0 and no access."
          fi
          args=(. --output pickled-report.json --verbose)
          [[ -n "$PICKLED_TASK" ]] && args+=(--task "$PICKLED_TASK")
          [[ -n "$PICKLED_AGENT" ]] && args+=(--agent "$PICKLED_AGENT")
          [[ -n "$PICKLED_ACCESS" ]] && args+=(--access "$PICKLED_ACCESS")
          [[ -n "$PICKLED_THRESHOLD" ]] && args+=(--threshold "$PICKLED_THRESHOLD")
          [[ -n "$PICKLED_MAX_CELLS" ]] && args+=(--max-cells "$PICKLED_MAX_CELLS")
          ./apps/cli/dist/index.js "$PICKLED_COMMAND" "${args[@]}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pickled-report-${{ inputs.command }}
          path: pickled-report.json
          # error, not warn: a missing receipt means the run broke before
          # producing one (auth/config/runtime). A low-score receipt still
          # uploads cleanly; that is signal, not infra failure.
          if-no-files-found: error

      - name: Reflect Pickled verdict
        env:
          PICKLED_COMMAND: ${{ inputs.command }}
        run: |
          code="${{ steps.run.outputs.exit_code }}"
          echo "pickled $PICKLED_COMMAND exited with code $code"
          echo "non-zero means the run did not pass: a cell scored below threshold, OR one or more cells errored (auth/config/runtime). The two look the same from the exit code - read the uploaded receipt's per-cell 'error' fields to tell them apart."
          exit "${code:-1}"
